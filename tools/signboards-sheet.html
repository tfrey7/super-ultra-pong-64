<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Era signboards: the contact sheet</title>
<!--
  The signboards side by side (items 1183, 1184), each drawn by the real
  src/signboards.js over its own era's field, as the ring leaves them:
  on the left at the page's full 800 x 600, on the right the same card
  squeezed down to the machine's own screen and blown back up block for
  block -- which is what "legible at its era's resolution" means.
  Open off disk, or shoot it:
    py -3.10 "G:/Claude Stuff/fleet-console/scripts/shot.py"
       "file:///<repo>/tools/signboards-sheet.html" docs/shots/signboards/contact-sheet.png
  ?t=0.6 draws them at another moment (the blinking words go off).
  ?from=5&to=10 draws the six 3D machines' instead of the first five:
       "file:///<repo>/tools/signboards-sheet.html?from=5&to=10" docs/shots/signboards/contact-sheet-3d.png
-->
<style>
  body { margin: 0; padding: 16px; background: #15151c; color: #d8d8e0;
         font: 13px/1.4 system-ui, sans-serif; }
  h1 { font-size: 16px; margin: 0 0 12px; }
  .row { display: flex; gap: 16px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .row b { width: 170px; }
  canvas { image-rendering: pixelated; border: 1px solid #333; background: #000; }
</style>
</head>
<body>
  <h1 id="title">Era signboards, 1972 to 1991: at full size, and at the machine's own resolution</h1>
  <div id="sheet"></div>
  <script src="../src/game.js"></script>
  <script src="../src/sprites.js"></script>
  <script src="../src/render.js"></script>
  <script src="../src/table3d.js"></script>
  <script src="../src/eras/era0-arcade.js"></script>
  <script src="../src/eras/era1-atari2600.js"></script>
  <script src="../src/eras/era2-nes.js"></script>
  <script src="../src/eras/era3-genesis.js"></script>
  <script src="../src/eras/era4-snes.js"></script>
  <script src="../src/eras/era5-playstation.js"></script>
  <script src="../src/eras/era6-n64.js"></script>
  <script src="../src/eras/era7-dreamcast.js"></script>
  <script src="../src/eras/era8-ps2.js"></script>
  <script src="../src/eras/era9-xbox.js"></script>
  <script src="../src/eras/era10-xbox360.js"></script>
  <script src="../src/signboards.js"></script>
  <script src="../src/erachange.js"></script>
  <script>
    (function () {
      var R = window.PongRender, S = R.SIGNBOARD;
      var q = /[?&]t=([0-9.]+)/.exec(location.search);
      var t = q ? Number(q[1]) : 0.1;
      var sheet = document.getElementById('sheet');
      // ?from=5&to=10 draws the 3D machines' six (item 1184).
      var qf = /[?&]from=([0-9]+)/.exec(location.search), qt = /[?&]to=([0-9]+)/.exec(location.search);
      var from = qf ? Number(qf[1]) : 0, to = qt ? Number(qt[1]) : 4;
      var years = { 0: 1972, 4: 1991, 5: 1994, 10: 2005 };
      if (from !== 0 || to !== 4) document.getElementById('title').textContent =
        'Era signboards, ' + (years[from] || 'era ' + from) + ' to ' + (years[to] || 'era ' + to) + ': at full size, and at the machine\'s own resolution';
      for (var era = from; era <= to; era++) {
        var g = Pong.createGame({ rng: function () { return 0.3; }, phase: 'playing', era: era });
        var full = document.createElement('canvas');
        full.width = g.width; full.height = g.height;
        var fx = full.getContext('2d');
        R.draw(fx, g, {});
        var k = R.drawSignboard(fx, g, { era: era, text: R.eraCardText(era), t: t }, R.eraCardStyle(era));
        var r = k.rect, pad = 24;
        var cx = Math.max(0, r.x - pad), cy = Math.max(0, r.y - pad);
        var cw = Math.min(g.width - cx, r.w + 2 * pad), ch = Math.min(g.height - cy, r.h + 2 * pad);

        var big = document.createElement('canvas');
        big.width = cw; big.height = ch;
        big.getContext('2d').drawImage(full, cx, cy, cw, ch, 0, 0, cw, ch);

        // The whole screen down to the machine's own pixels, then the card's
        // patch of that back up block for block. Squeezing the whole screen
        // (item 1196) keeps the machine's pixel grid where the machine had it;
        // squeezing only the crop shifted it by wherever the crop began.
        var res = S.resolution[era];
        var sx = res.w / g.width, sy = res.h / g.height;
        var tiny = document.createElement('canvas');
        tiny.width = res.w; tiny.height = res.h;
        var tx = tiny.getContext('2d');
        tx.imageSmoothingEnabled = true;
        tx.drawImage(full, 0, 0, g.width, g.height, 0, 0, res.w, res.h);
        var low = document.createElement('canvas');
        low.width = cw; low.height = ch;
        var lx = low.getContext('2d');
        lx.imageSmoothingEnabled = false;
        lx.drawImage(tiny, cx * sx, cy * sy, cw * sx, ch * sy, 0, 0, cw, ch);

        var row = document.createElement('div');
        row.className = 'row';
        var label = document.createElement('b');
        label.textContent = 'Era ' + era + ': ' + R.eraCardText(era) + '  (' + res.w + ' x ' + res.h + ')';
        row.appendChild(label);
        row.appendChild(big);
        row.appendChild(low);
        sheet.appendChild(row);
      }
    })();
  </script>
</body>
</html>
