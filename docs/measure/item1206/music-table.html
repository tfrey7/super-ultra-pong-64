<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Super Ultra Pong 64 -- the soundtrack, era by era</title>
<style>
  body { margin: 0; padding: 28px 36px; background: #101216; color: #e8e6e1;
         font: 15px/1.45 "Segoe UI", system-ui, sans-serif; }
  h1 { margin: 0 0 4px; font-size: 24px; letter-spacing: 0.02em; }
  .sub { color: #9aa0a8; margin-bottom: 22px; }
  .era { display: grid; grid-template-columns: 250px 1fr; gap: 18px; padding: 14px 0;
         border-top: 1px solid #262a31; }
  .era h2 { margin: 0; font-size: 17px; }
  .era .n { color: #7d8590; font-weight: 600; margin-right: 6px; }
  .meta { color: #9aa0a8; font-size: 12.5px; margin-top: 4px; }
  .about { margin-top: 8px; font-size: 14px; }
  .voices { font: 12px/1.5 Consolas, monospace; color: #b9c0c8; margin-top: 6px; }
  canvas { width: 100%; background: #181b21; border-radius: 6px; display: block; }
  .empty { color: #6b727c; font-style: italic; }
  .slot { border: 1px dashed #333a44; border-radius: 6px; height: 34px; display: flex; align-items: center;
          padding: 0 12px; color: #6b727c; font-size: 13px; }
</style>
</head>
<body>
<h1>Every era plays its own music</h1>
<div class="sub">Drawn from the live song table in src/music.js: one row per era, each track a lane, each note a bar at its pitch and length. Eras 5 to 10 are the slots the next card fills.</div>
<div id="rows"></div>
<script src="../../../src/music.js"></script>
<script>
  var M = window.PongMusic;
  var COLORS = ['#f4b942', '#5ec2e8', '#ef6f8a', '#8fd26b', '#b48cf2', '#f08c4a'];
  var NAMES = ['1972 arcade', 'Atari 2600', 'NES', 'Genesis', 'Super Nintendo',
               'PlayStation', 'Nintendo 64', 'Dreamcast', 'PlayStation 2', 'Xbox', 'Xbox 360'];
  var rows = document.getElementById('rows');
  M.SONGS.forEach(function (song, era) {
    var div = document.createElement('div');
    div.className = 'era';
    var left = document.createElement('div');
    var right = document.createElement('div');
    div.appendChild(left); div.appendChild(right);
    rows.appendChild(div);
    if (!song) {
      left.innerHTML = '<h2><span class="n">' + era + '</span>' + NAMES[era] + '</h2><div class="meta empty">empty slot</div>';
      right.innerHTML = '<div class="slot">no loop yet -- a row in the same format goes here</div>';
      return;
    }
    var names = Object.keys(song.tracks);
    var meta = song.bpm ? song.bpm + ' bpm, ' + song.steps + ' steps x ' + song.bars + ' bars' : 'no tempo: drone only';
    if (song.effects) meta += ', ' + Object.keys(song.effects).join(' + ');
    var vs = names.map(function (n, i) {
      var v = song.voices[n];
      return '<span style="color:' + COLORS[i % COLORS.length] + '">' + n + '</span> ' + v.wave +
        (v.fm ? ' fm' : '') + (v.unison ? ' x' + (v.unison.length + 1) : '') + (v.filter ? ' ' + v.filter.type : '');
    });
    if (song.drone) vs = song.drone.map(function (d) { return 'drone ' + d.wave + ' ' + d.freq + ' Hz' + (d.filter ? ' ' + d.filter.type : '') + (d.wobble ? ' flicker' : ''); });
    left.innerHTML = '<h2><span class="n">' + era + '</span>' + song.name + '</h2><div class="meta">' + meta +
      '</div><div class="voices">' + vs.join('<br>') + '</div>';
    var about = document.createElement('div');
    about.className = 'about';
    about.textContent = song.about;
    var cv = document.createElement('canvas');
    var lanes = Math.max(1, names.length);
    var laneH = names.length ? 44 : 60;
    cv.width = 1060; cv.height = lanes * laneH + 8;
    cv.style.height = cv.height + 'px';
    right.appendChild(cv);
    right.appendChild(about);
    var g = cv.getContext('2d');
    if (!names.length) {
      // The drone: a flat hum line and a flickering buzz.
      g.strokeStyle = COLORS[0]; g.lineWidth = 3;
      g.beginPath(); g.moveTo(10, 40); g.lineTo(cv.width - 10, 40); g.stroke();
      g.strokeStyle = '#9aa0a8'; g.lineWidth = 1.5; g.beginPath();
      for (var x = 10; x < cv.width - 10; x += 2) g.lineTo(x, 22 + Math.sin(x * 0.9) * 3 * (0.6 + 0.4 * Math.sin(x * 0.05)));
      g.stroke();
      g.fillStyle = '#7d8590'; g.font = '12px Consolas'; g.fillText('60 Hz hum', 12, 56); g.fillText('tube buzz, 7 Hz flicker', 12, 14);
      return;
    }
    var total = song.steps * song.bars;
    var w = (cv.width - 20) / total;
    for (var b = 0; b <= song.bars; b++) {
      g.fillStyle = '#2a2f37'; g.fillRect(10 + b * song.steps * w, 0, 1, cv.height);
    }
    names.forEach(function (n, li) {
      var bars = song.tracks[n].map(function (bar) { return M.parseBar(bar, song.steps); });
      var lo = Infinity, hi = -Infinity;
      bars.forEach(function (evs) { evs.forEach(function (e) { if (e) e.freqs.forEach(function (f) {
        var p = Math.log2(f); lo = Math.min(lo, p); hi = Math.max(hi, p); }); }); });
      var y0 = 4 + li * laneH;
      g.fillStyle = li % 2 ? '#1c2027' : '#1a1d23'; g.fillRect(10, y0, cv.width - 20, laneH - 2);
      g.fillStyle = COLORS[li % COLORS.length];
      bars.forEach(function (evs, bi) {
        evs.forEach(function (e, si) {
          if (!e) return;
          var x = 10 + (bi * song.steps + si) * w;
          if (!e.freqs.length) {
            var hh = e.accent ? laneH - 10 : (laneH - 10) * 0.55;
            g.fillRect(x + 1, y0 + laneH - 4 - hh, Math.max(2, w * 0.35), hh);
            return;
          }
          e.freqs.forEach(function (f) {
            var p = Math.log2(f);
            var span = Math.max(0.5, hi - lo);
            var y = y0 + 5 + (1 - (p - lo) / span) * (laneH - 14);
            g.fillRect(x + 1, y, e.len * w - 2, 5);
          });
        });
      });
    });
  });
</script>
</body>
</html>
