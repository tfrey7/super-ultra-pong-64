<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Ultra Pong 64: Remastered</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    /* The cursor is the paddle; nothing else needs to be pointed at. */
    cursor: none;
  }
  canvas {
    display: block;
    /* Fit the window while keeping the field's 4:3 shape, and keep the blocks
       hard-edged rather than smoothed when the browser scales it. */
    width: auto;
    height: 100vh;
    max-width: 100vw;
    max-height: 75vw;
    aspect-ratio: 4 / 3;
    background: #000;
    image-rendering: pixelated;
  }
</style>
</head>
<body>
  <canvas id="field" width="800" height="600"
          aria-label="Pong: your paddle on the left, the computer on the right"></canvas>

  <!-- Plain scripts, in dependency order, so this page opens straight off disk:
       ES modules are blocked over file:// and would need a dev server.
       The list sits inside a <template>, where the browser parses it but runs
       nothing; the small loader after it starts each one, in this order, with a
       ?v= stamp that changes every minute. GitHub Pages tells the browser to
       keep every file for ten minutes, and a plain refresh (F5) re-checks the
       page but not its scripts, so without the stamp a new game stayed hidden
       behind the old scripts until a hard refresh (item 1193). -->
  <template id="game-scripts">
  <script src="src/game.js"></script>
  <!-- Named pixel-art images from assets/pixellab/ (tools/pixellab.mjs makes
       them), for any era file to draw with one drawImage: window.PongSprites. -->
  <script src="src/sprites.js"></script>
  <script src="src/render.js"></script>
  <!-- The shared 3D table the eras from the PlayStation up stand on
       (docs/ERAS.md section 2); PongRender hands it to every era as table3d. -->
  <script src="src/table3d.js"></script>
  <!-- One file per era, in ladder order, each registering its look with the
       renderer. An era card replaces its own file and touches no other; a new
       rung is one new file and one line here. -->
  <script src="src/eras/era0-arcade.js"></script>
  <script src="src/eras/era1-atari2600.js"></script>
  <script src="src/eras/era2-nes.js"></script>
  <script src="src/eras/era3-genesis.js"></script>
  <script src="src/eras/era4-snes.js"></script>
  <script src="src/eras/era5-playstation.js"></script>
  <script src="src/eras/era6-n64.js"></script>
  <script src="src/eras/era7-dreamcast.js"></script>
  <script src="src/eras/era8-ps2.js"></script>
  <script src="src/eras/era9-xbox.js"></script>
  <script src="src/eras/era10-xbox360.js"></script>
  <!-- The era change as a moment: flash, wipe and name card, over the frame. -->
  <script src="src/erachange.js"></script>
  <!-- The voice: every era's notes, synthesised on the page, silent until the
       first click or key. -->
  <script src="src/sound.js"></script>
  <script src="src/input.js"></script>
  <script src="src/main.js"></script>
  </template>
  <script>
    (function () {
      var stamp = Math.floor(Date.now() / 60000);
      var list = document.getElementById('game-scripts').content.querySelectorAll('script[src]');
      for (var i = 0; i < list.length; i++) {
        var s = document.createElement('script');
        s.src = list[i].getAttribute('src') + '?v=' + stamp;
        s.async = false; // added scripts otherwise run in whatever order they arrive
        document.body.appendChild(s);
      }
    })();
  </script>
</body>
</html>
